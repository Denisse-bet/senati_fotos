<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#086de0">
<title>Registro fotográfico SENATI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;overflow:hidden;background:#086de0}
.fondo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
.panel{
  position:fixed;z-index:2;top:50%;right:4%;transform:translateY(-50%);
  width:clamp(250px,27vw,360px);padding:22px;display:flex;flex-direction:column;
  align-items:center;gap:14px;text-align:center;border:1px solid #2448b5;
  border-radius:25px;background:rgba(220,237,255,.94);box-shadow:0 8px 30px #00245b55
}
h1{margin:0;color:#073b9f;font-size:clamp(21px,2vw,25px)}
p{margin:0;color:#152e60;font-size:15px;line-height:1.5}
#codigoQR{width:210px;height:210px;padding:8px;display:flex;align-items:center;justify-content:center;background:white;border-radius:12px}
#codigoQR img,#codigoQR canvas{display:block;max-width:100%;height:auto}
#estado{font-size:12px}
@media(max-width:700px){
  .fondo{object-fit:cover}
  .panel{top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:min(88vw,330px);max-height:94dvh;overflow-y:auto;padding:20px;gap:12px}
  #codigoQR{width:190px;height:190px}
  h1{font-size:23px}
}
</style>
</head>
<body>
<picture>
  <source media="(min-width: 701px)" srcset="saliendo1.png">
  <img class="fondo" src="saliendo.png" alt="Estudiantes SENATI">
</picture>

<main class="panel">
  <h1>¡Participa con SENATI!</h1>
  <p>Escanea el código QR con la cámara de tu celular para ingresar a la selección de fotografías.</p>
  <div id="codigoQR" aria-label="Código QR para seleccionar fotos"></div>
  <p id="estado" role="status" aria-live="polite">Preparando código QR...</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Publica todo en la misma carpeta web. El QR abre directamente subirft.html. */
const urlDestino = new URL("subirft.html", window.location.href).href;
const areaQR = document.getElementById("codigoQR");
const estado = document.getElementById("estado");

if (typeof QRCode !== "undefined") {
  new QRCode(areaQR, {
    text: urlDestino,
    width: 194,
    height: 194,
    colorDark: "#08276c",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
  estado.textContent = "Escanea para seleccionar tus fotos.";
} else {
  estado.textContent = "No se pudo generar el QR. Verifica tu conexión a internet y recarga la página.";
}
</script>
</body>
</html>
